<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Queuemaxxing</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Queue admin</p>
          <h1>Queuemaxxing</h1>
          <p class="lede">A small client for creating queues, publishing messages, and testing claims.</p>
        </div>
        <div class="status"><i></i><span id="health">Connecting</span></div>
      </header>

      <section class="grid">
        <article class="card creator">
          <div class="card-head"><span>1</span><h2>Create a queue</h2></div>
          <form id="create-form">
            <label>Queue name<input id="queue-name" value="workouts" required pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}"></label>
            <div class="row">
              <label>Order<select id="discipline"><option value="fifo">FIFO</option><option value="lifo">LIFO</option></select></label>
              <label class="check"><input id="priority-enabled" type="checkbox" checked><span>Use priority</span></label>
            </div>
            <label>Default delay (ms)<input id="default-delay" type="number" min="0" value="0"></label>
            <button type="submit">Create <span>→</span></button>
          </form>
        </article>

        <article class="card publisher">
          <div class="card-head"><span>2</span><h2>Publish a message</h2></div>
          <form id="publish-form">
            <label>Target queue<select id="publish-queue"></select></label>
            <label>JSON payload<textarea id="payload" rows="4">{"task":"deadlift","reps":5}</textarea></label>
            <div class="row triple">
              <label>Priority<input id="message-priority" type="number" value="10"></label>
              <label>Delay override (ms)<input id="delay" type="number" min="0" placeholder="queue default"></label>
              <label>Dedupe key<input id="dedupe" placeholder="optional"></label>
            </div>
            <button type="submit">Publish <span>＋</span></button>
          </form>
        </article>
      </section>

      <section class="card workbench">
        <div class="workbench-top">
          <div class="card-head"><span>3</span><h2>Inspect and claim</h2></div>
          <div class="controls">
            <select id="consume-queue" aria-label="Consume queue"></select>
            <button id="refresh" class="secondary">Refresh</button>
            <button id="claim">Claim next</button>
          </div>
        </div>
        <div id="queue-meta" class="metrics"></div>
        <div id="messages" class="messages"><p class="empty">Create a queue to get started.</p></div>
      </section>

      <div id="toast" role="status"></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
